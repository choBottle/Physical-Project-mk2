# MK2 중앙 Prometheus — 관측 metric 저장 + 엣지 페더레이션 중앙
#
# 수정 전에 반드시:  docker compose exec prometheus promtool check config /etc/prometheus/prometheus.yml
# 설정만 바꾼 뒤 반영(재생성 불필요):  curl -X POST http://127.0.0.1:7861/-/reload
#
# ⚠ 이 파일은 현장에서 고치지 않는다(업그레이드 때 git checkout 과 부딪친다). 현장 설정은 deploy/site/prometheus/
#   (gitignore — 컨테이너의 /etc/prometheus/site)에 둔다:
#     edge-targets/*.yml   엣지 페더레이션 타깃(file_sd — reload 없이 반영)
#     scrape/*.yml         현장 전용 수집 잡(scrape_config_files)
#     rules/*.yml          현장 전용 알림 규칙
#     alertmanagers/*.yml  Alertmanager 주소(file_sd) — 없으면 알림은 Prometheus UI 에만 뜬다
#   각 폴더의 *.example 이 형식이다.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    agg_layer: central

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/site/rules/*.yml

# 현장 전용 수집 잡 — 파일이 없으면 아무것도 더하지 않는다
scrape_config_files:
  - /etc/prometheus/site/scrape/*.yml

alerting:
  alertmanagers:
    - file_sd_configs:
        - files: [/etc/prometheus/site/alertmanagers/*.yml]

scrape_configs:
  # 백엔드 A층(자기 관측) + C층(업무 값의 관측 표현) — Collector 의 prometheus exporter
  # 백엔드 export 15초 × 표본 3 이 되도록 5s
  - job_name: otel_collector
    scrape_interval: 5s
    static_configs:
      - targets: ["otel-collector:8889"]

  # Collector 자신의 상태(수신·거부·전송 실패)
  - job_name: otel_collector_self
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  # ── 엣지 페더레이션 (2계층) ─────────────────────────────────────────────
  # 엣지가 raw 를 1차 보관하고 중앙은 요약만 당긴다(부하가 구역 수에 비례). 타깃(엣지 터널 주소)은
  # deploy/site/prometheus/edge-targets/*.yml 에 둔다 — 파일이 없으면 타깃 0개(잡은 비어 있다).
  # match[] 를 넓히지 않는다 — 엣지 raw 전량을 끌어오면 2계층의 의미가 없다.
  # 엣지 쪽 스택: deploy/edge/  ·  문서: docs/deployment/edge.md · observability.md §6
  - job_name: edge_federate
    honor_labels: true
    metrics_path: /federate
    scrape_interval: 15s
    params:
      "match[]":
        - '{__name__=~"hw_.*"}'
        - '{__name__=~"system_cpu_.*|system_memory_.*"}'
    file_sd_configs:
      - files: [/etc/prometheus/site/edge-targets/*.yml]
