# MK2 Loki — log 저장 (Collector 가 OTLP 로 넣는다)
#
# v13 스키마 + tsdb 저장소: 구조화 메타데이터와 네이티브 OTLP 수집의 전제다(boltdb-shipper 는 둘 다 안 된다).
# 보존: 아래 세 줄(retention_enabled · retention_period · delete_request_store)이 **함께** 있어야 집행된다.

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 14d

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
