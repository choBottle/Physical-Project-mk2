# MK2 중앙 Mosquitto — 말단·엣지 업무 발행 수용 (구간 1·2)
#
# ⚠ 기본 프로파일은 익명 허용이다. 노출 통제는 compose 의 바인딩 주소(MK2_EDGE_BIND — 기본 127.0.0.1)가 한다.
#   터널 밖(공인망)에 열어야 한다면 아래 「운영 프로파일」을 켠다. docs/deployment/security.md

# retained(status 등)를 브로커 재시작 뒤에도 유지한다
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# MQTT (말단·엣지)
listener 1883
# MQTT over WebSocket (브라우저 도구 — 가시화 파트)
listener 9001
protocol websockets

allow_anonymous true

# ── 운영 프로파일 (계정 + ACL) ────────────────────────────────────────────
# 1) 비밀번호 파일 생성:  docker compose exec mosquitto mosquitto_passwd -c /mosquitto/data/passwd <user>
# 2) 아래 주석을 풀고 allow_anonymous false 로 바꾼 뒤:  docker compose restart mosquitto
# allow_anonymous false
# password_file /mosquitto/data/passwd
# acl_file /mosquitto/config/acl
