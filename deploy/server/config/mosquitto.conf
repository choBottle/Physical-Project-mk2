# MK2 중앙 Mosquitto — 말단·엣지 업무 발행 수용 (구간 1·2)
#
# ⚠ 기본 프로파일은 익명 허용이다. 노출 통제는 compose 의 바인딩 주소(MK2_EDGE_BIND — 기본 127.0.0.1)가 한다.
#   터널 밖(공인망)에 열어야 한다면 「운영 프로파일」(계정 + ACL)을 켠다 — docs/deployment/security.md
#
# 이 파일은 현장에서 고치지 않는다(업그레이드 때 git checkout 과 부딪친다). 현장 설정은 deploy/site/mosquitto/*.conf
# (gitignore)에 둔다 — 맨 아래 include_dir 이 읽는다. 운영 프로파일 형식: deploy/site/mosquitto/auth.conf.example

# retained(status 등)를 브로커 재시작 뒤에도 유지한다
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# MQTT (말단·엣지)
listener 1883
# MQTT over WebSocket (브라우저 도구 — 가시화 파트)
listener 9001
protocol websockets

allow_anonymous true

# 현장 설정(운영 프로파일 등) — 마지막에 둔다(앞의 값을 덮어쓸 수 있게). 반영: docker compose restart mosquitto
include_dir /mosquitto/config/site.d
