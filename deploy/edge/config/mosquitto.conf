# MK2 엣지 Mosquitto — 구역 LAN 의 말단 장치가 붙는 브로커 + 중앙 브로커로의 브릿지 (구간 2)
#
# 중앙 서버의 deploy/server/config/mosquitto.conf 와 따로 둔다 — 엣지에만 브릿지가 있다.
# 브릿지 설정(bridge.d/bridge.conf)은 mosquitto.conf 가 환경변수를 읽지 못해서 기동 때
# config/mosquitto-entrypoint.sh 가 deploy/edge/.env 의 MK2_CENTRAL_MQTT_* 로 만든다.
#
# 이 파일은 고치지 않는다(업그레이드 때 git checkout 과 부딪친다). 현장 설정(계정·ACL 등)은
# deploy/edge/site/mosquitto/*.conf 에 둔다 — gitignore 대상이며 아래 include_dir 이 읽는다.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# MQTT (구역 LAN 의 말단 장치)
listener 1883
# MQTT over WebSocket (브라우저 도구)
listener 9001
protocol websockets

# 노출 통제는 compose 의 바인딩 주소(MK2_EDGE_LAN_BIND)가 한다. 계정을 켜려면 site/mosquitto/auth.conf.example.
allow_anonymous true

# 기동 때 생성되는 중앙 브릿지 (mosquitto-entrypoint.sh)
include_dir /mosquitto/config/bridge.d

# 현장 설정 — 마지막에 둔다(앞의 값을 덮어쓸 수 있게)
include_dir /mosquitto/config/site.d
