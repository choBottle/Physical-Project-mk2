# MK2 엣지 Prometheus — 구역 raw metric 보관. 중앙이 /federate 로 요약만 당겨 간다.
global:
  scrape_interval: 15s
  external_labels:
    agg_layer: edge

# 현장 전용 수집 잡(예: 가용성 판정 :9105) — deploy/edge/site/prometheus/scrape/*.yml (gitignore). 이 파일은 고치지 않는다.
scrape_config_files:
  - /etc/prometheus/site/scrape/*.yml

scrape_configs:
  - job_name: otel_collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # 엣지 가용성 판정 참조 구현(hardware/edge/availability.py, :9105) — site/prometheus/scrape/hw-availability.yml.example
