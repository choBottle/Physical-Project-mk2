# =============================================================================
# MK2 중앙 서버 스택 — 빈 서버에서 한 번에 재현되는 배포 정의
#
#   cd deploy
#   ./scripts/init-env.sh          # .env 생성(비밀값 무작위 생성)
#   docker compose up -d --build --wait
#   ./scripts/healthcheck.sh       # "떠 있다"가 아니라 "흐른다"까지 확인
#
# 구성(5구간 중 구간 4 — 중앙 서버):
#   업무   Mosquitto(MQTT) → be-ingest → Kafka → be-storage(TimescaleDB·MySQL) / be-gateway(WS)
#   영상   엣지 → be-gateway /ingest(8766) → 뷰어 /media(8765) — 업무·관측 채널에 싣지 않는다
#   관측   OTLP → OTel Collector → Prometheus(metric) · Loki(log) · Tempo(trace) → Grafana
#
# 원칙
#   - 이미지 버전을 고정한다(`:latest` 금지 — 같은 이름으로 내용이 바뀐다).
#   - 비밀값은 .env 에서만 온다(이 파일에 평문 비밀번호 없음 — 커밋 가능).
#   - 바인딩 주소가 곧 노출 통제다: 엣지 입구는 MK2_EDGE_BIND, 운영 화면·DB 는 MK2_ADMIN_BIND.
#   - DB 스키마의 정본은 server/infra/sql/ 이다. 여기서는 그 파일을 읽어 최초 1회 적용할 뿐 사본을 두지 않는다.
#   - 호스트 포트 번호는 기존 운영 서버와 같다(7858·7859·7861·7862·4316 …) — 백엔드 기본값·pytest·문서가 그대로 맞는다.
# 상세: docs/deployment/README.md
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-mk2}

x-backend: &backend
  image: ${MK2_BACKEND_IMAGE:-mk2-backend:local}
  build:
    context: ../server
  restart: unless-stopped
  environment:
    # 접속 주소 — 컨테이너 안이라 localhost 가 아니라 compose 서비스 이름으로 붙는다
    MK2_MQTT_HOST: mosquitto
    MK2_MQTT_PORT: "1883"
    MK2_BROKER_HOST: mosquitto
    MK2_KAFKA_BOOTSTRAP: kafka:9094
    MK2_MYSQL_HOST: mysql
    MK2_MYSQL_PORT: "3306"
    MK2_MYSQL_PASSWORD: ${MK2_MYSQL_PASSWORD:?deploy/.env 에 MK2_MYSQL_PASSWORD 가 없다 — scripts/init-env.sh}
    MK2_TSDB_HOST: timescaledb
    MK2_TSDB_PORT: "5432"
    MK2_TSDB_PASSWORD: ${MK2_TSDB_PASSWORD:?deploy/.env 에 MK2_TSDB_PASSWORD 가 없다}
    MK2_OTEL_ENDPOINT: http://otel-collector:4317
    # 입구 — 컨테이너 안에서는 0.0.0.0 으로 듣고, 실제 노출은 아래 ports 의 바인딩 주소가 정한다
    MK2_WS_HOST: 0.0.0.0
    MK2_WS_TOKEN: ${MK2_WS_TOKEN:?deploy/.env 에 MK2_WS_TOKEN 이 없다}
    MK2_MEDIA_INGEST_HOST: 0.0.0.0
    MK2_EDGE_TOKEN: ${MK2_EDGE_TOKEN:?deploy/.env 에 MK2_EDGE_TOKEN 이 없다}
    MK2_CAPTURE_HOST: 0.0.0.0
    MK2_CAPTURE_TOKEN: ${MK2_CAPTURE_TOKEN:?deploy/.env 에 MK2_CAPTURE_TOKEN 이 없다}
  volumes:
    - backend_data:/data
  networks: [mk2]
  depends_on:
    mosquitto: { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }
    mysql: { condition: service_healthy }
    timescaledb: { condition: service_healthy }
    otel-collector: { condition: service_started }

services:

  # ── 업무 평면 ──────────────────────────────────────────────────────────────

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "${MK2_EDGE_BIND:-127.0.0.1}:1883:1883"     # MQTT (말단·엣지 발행)
      - "${MK2_EDGE_BIND:-127.0.0.1}:9001:9001"     # MQTT over WebSocket (브라우저 도구)
    volumes:
      - ./server/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks: [mk2]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 10s
      timeout: 5s
      retries: 6

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # PLAINTEXT = 호스트 프로세스(pytest 등) · INTERNAL = 같은 도커 망(백엔드 컨테이너) · EDGE = 원격 엣지(터널)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094,EDGE://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094,EDGE://${MK2_KAFKA_EDGE_ADVERTISED:-localhost}:9095
      # EDGE 항목이 빠지면 브로커가 기동에 실패한다. SASL 은 인증·인가 단계(BE-Q-04)에서.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EDGE:PLAINTEXT
      # 단일 노드 — 복제 인자를 1로 두지 않으면 내부 토픽 생성이 즉시 실패한다
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Kafka 는 장기 저장소가 아니다(원칙 11) — 단기 버퍼·replay 7일
      KAFKA_LOG_RETENTION_HOURS: 168
      # 오타 토픽이 자동 생성되면 발행자는 성공했다고 믿는데 아무도 안 읽는다
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:9092:9092"
      - "${MK2_EDGE_BIND:-127.0.0.1}:9095:9095"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [mk2]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # 토픽은 명시적으로 만든다(자동 생성 off). 채널별 3토픽 — 장치별·구역별 토픽이 아니다.
  kafka-init:
    image: apache/kafka:4.1.0
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in mk2.telemetry.state mk2.telemetry.status mk2.telemetry.heartbeat; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists \
            --topic "$$t" --partitions 1 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --list
    networks: [mk2]
    depends_on:
      kafka: { condition: service_healthy }

  # ── 저장 축 ────────────────────────────────────────────────────────────────

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?deploy/.env 에 MYSQL_ROOT_PASSWORD 가 없다}
      # 아래 둘은 최초 초기화 스크립트(initdb/mysql)만 읽는다
      MK2_MYSQL_PASSWORD: ${MK2_MYSQL_PASSWORD}
      MK2_DB_APP_HOST: ${MK2_DB_APP_HOST:-172.28.%}
    ports:
      - "${MK2_ADMIN_BIND:-127.0.0.1}:${MK2_PORT_MYSQL:-7858}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../server/infra/sql:/mk2-sql:ro
      - ./server/initdb/mysql/10-mk2-init.sh:/docker-entrypoint-initdb.d/10-mk2-init.sh:ro
    networks: [mk2]
    healthcheck:
      # TCP(127.0.0.1)로 묻는다 — 초기화 중 임시 서버는 소켓만 열어 두므로, 소켓 ping 은 초기화가
      # 끝나기 전에 healthy 를 낸다. 스키마까지 선 뒤에만 통과한다.
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1 FROM mk2.mission_event LIMIT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  timescaledb:
    image: timescale/timescaledb:2.30.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${MK2_TSDB_ROOT_PASSWORD:?deploy/.env 에 MK2_TSDB_ROOT_PASSWORD 가 없다}
      POSTGRES_DB: mk2
      # 아래 둘은 최초 초기화 스크립트(initdb/timescaledb)만 읽는다
      MK2_TSDB_PASSWORD: ${MK2_TSDB_PASSWORD}
      MK2_NET_SUBNET: ${MK2_NET_SUBNET:-172.28.0.0/16}
    ports:
      - "${MK2_ADMIN_BIND:-127.0.0.1}:${MK2_PORT_TSDB:-7859}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ../server/infra/sql:/mk2-sql:ro
      # ⚠ 디렉터리가 아니라 **파일 하나**를 initdb.d 에 넣는다. 디렉터리를 마운트하면 이미지가 넣어 둔
      #   자기 초기화 스크립트(timescaledb 확장 설치·튜닝)가 통째로 가려진다.
      - ./server/initdb/timescaledb/100_mk2_init.sh:/docker-entrypoint-initdb.d/100_mk2_init.sh:ro
    networks: [mk2]
    healthcheck:
      # TCP 로 묻는다 — 초기화 중 임시 서버는 TCP 를 열지 않는다
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d mk2"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # ── 백엔드 상주 4개 (같은 이미지, command 만 다르다) ──────────────────────

  be-ingest:
    <<: *backend
    command: ["python", "-m", "backend.ingest.bridge"]

  be-storage:
    <<: *backend
    command: ["python", "-m", "backend.storage.consumer"]

  be-gateway:
    <<: *backend
    command: ["python", "-m", "backend.gateway.ws_echo"]
    ports:
      - "${MK2_EDGE_BIND:-127.0.0.1}:8765:8765"     # 뷰어 /state · /media (토큰)
      - "${MK2_EDGE_BIND:-127.0.0.1}:8766:8766"     # 엣지 미디어 입구 /ingest (토큰)

  be-capture:
    <<: *backend
    command: ["python", "-m", "backend.gateway.capture"]
    ports:
      - "${MK2_EDGE_BIND:-127.0.0.1}:8767:8767"     # 촬영본 PUT /capture (토큰)

  # ── 관측 평면 ──────────────────────────────────────────────────────────────

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.150.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      MK2_OTLP_CORS_EXTRA_ORIGIN: ${MK2_OTLP_CORS_EXTRA_ORIGIN:-http://localhost:5175}
    ports:
      # 4316 = 백엔드 문서·기본값의 입구, 4317 = OTLP 표준(HW·AI 노드 기본값) — 같은 수신단 둘
      - "${MK2_EDGE_BIND:-127.0.0.1}:4316:4317"
      - "${MK2_EDGE_BIND:-127.0.0.1}:4317:4317"
      - "${MK2_EDGE_BIND:-127.0.0.1}:4318:4318"     # OTLP/HTTP (브라우저, CORS)
    volumes:
      - ./server/config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [mk2]
    depends_on: [prometheus, loki, tempo]

  prometheus:
    image: prom/prometheus:v3.9.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 보존을 CLI 기본값에 기대지 않고 명시한다
      - --storage.tsdb.retention.time=${MK2_PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "${MK2_ADMIN_BIND:-127.0.0.1}:${MK2_PORT_PROMETHEUS:-7861}:9090"
    volumes:
      - ./server/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./server/config/prometheus-rules.yml:/etc/prometheus/rules/mk2.yml:ro
      - prometheus_data:/prometheus
    networks: [mk2]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6

  loki:
    image: grafana/loki:3.5.5
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "${MK2_ADMIN_BIND:-127.0.0.1}:${MK2_PORT_LOKI:-3100}:3100"
    volumes:
      - ./server/config/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks: [mk2]

  tempo:
    image: grafana/tempo:2.8.2
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    # Collector 만 도커 망 안에서 tempo:4317 로 넣는다 — 호스트에 OTLP 입구를 따로 열지 않는다(Collector 우회 금지)
    ports:
      - "${MK2_ADMIN_BIND:-127.0.0.1}:${MK2_PORT_TEMPO:-3200}:3200"
    volumes:
      - ./server/config/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    networks: [mk2]

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?deploy/.env 에 GRAFANA_ADMIN_PASSWORD 가 없다}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "${MK2_ADMIN_BIND:-127.0.0.1}:${MK2_PORT_GRAFANA:-7862}:3000"
    volumes:
      - ./server/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./server/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [mk2]
    depends_on: [prometheus, loki, tempo]

networks:
  mk2:
    # 대역 고정 — DB 앱 계정의 host 제한(MK2_DB_APP_HOST)과 TimescaleDB pg_hba 가 이 대역을 기준으로 한다
    ipam:
      config:
        - subnet: ${MK2_NET_SUBNET:-172.28.0.0/16}

volumes:
  mosquitto_data:
  kafka_data:
  mysql_data:
  timescale_data:
  backend_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
