# 저장소 전체 파이썬 린트 — 실제 버그만 잡는 보수적 규칙 묶음.
#   E9  : 구문 오류(파싱 실패)
#   F63 : 잘못된 비교(`is` 리터럴 등)
#   F7  : 문맥에 맞지 않는 문(`return` 밖·`break` 밖 등)
#   F82 : 정의되지 않은 이름(F821·F822·F823)
# 스타일 규칙은 일부러 넣지 않는다 — 파트마다 관례가 달라, 넣으면 소음에 진짜 오류가 묻힌다.
# CI `lint` 잡이 `ruff check .` 로 돌린다.
target-version = "py310"
extend-exclude = [
    "**/node_modules",
    "**/.venv",
    "**/venv",
    "**/build",
    "**/dist",
    "**/*_pb2.py",
    "**/*_pb2_grpc.py",
]

[lint]
select = ["E9", "F63", "F7", "F82"]
