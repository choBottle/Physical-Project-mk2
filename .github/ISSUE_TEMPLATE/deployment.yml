name: Deployment problem
description: Following the deployment guide did not work
labels: ["deployment"]
body:
  - type: markdown
    attributes:
      value: |
        Deployment guide: docs/deployment/README.md. Please check its troubleshooting section first.
        Remove passwords, tokens and real IP addresses from any logs you paste.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0, or the output of git rev-parse --short HEAD
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Ubuntu 24.04, Docker 27.x, Compose 2.x, 8 cores, 16 GB
    validations: { required: true }
  - type: textarea
    id: step
    attributes:
      label: Where did it stop?
      description: The step in the guide and the command you ran
    validations: { required: true }
  - type: textarea
    id: healthcheck
    attributes:
      label: Output of ./scripts/healthcheck.sh
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Output of docker compose ps -a and the logs of the failed service
      render: text
