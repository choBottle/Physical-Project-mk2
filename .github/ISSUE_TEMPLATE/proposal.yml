name: Proposal (RFC)
description: A feature proposal, or a change to an agreement shared by several parts (contracts, topics, database, ports, environment variables)
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        For a change to the data contracts, MQTT or Kafka topics, database schema, ports or deployment environment
        variables, add the `rfc` label and mention the maintainers of the affected parts. The proposal stays open
        for seven days of comments before a decision (see GOVERNANCE.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve (include site or organization requirements if any)
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations: { required: true }
  - type: textarea
    id: impact
    attributes:
      label: Impact (affected parts, backward compatibility, deployment changes, transition period)
