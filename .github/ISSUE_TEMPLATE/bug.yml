name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: dropdown
    id: part
    attributes:
      label: Part
      options: [server, hardware, ai, visualization, drone, camera360, osmocam, deploy, docs]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version or commit
