name: 버그 / Bug report
description: 기대와 다르게 동작한다
labels: ["bug"]
body:
  - type: dropdown
    id: part
    attributes:
      label: 파트
      options: [server, hardware, ai, visualization, drone, camera360, osmocam, deploy, docs]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나 · 무엇을 기대했나
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      placeholder: "1. …\n2. …"
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: 버전 / 커밋
