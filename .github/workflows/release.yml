# 릴리스 — 태그 v*.*.* 를 밀면 백엔드 이미지를 GHCR 에 게시하고 GitHub Release 초안을 만든다.
# 절차: docs/RELEASE.md §2
name: release

on:
  push:
    tags: ["v*.*.*"]

# 기본은 읽기 전용. 쓰기 권한은 필요한 잡에만 준다(최소 권한).
# 서드파티 액션은 커밋 SHA 로 고정한다(태그는 옮겨질 수 있다) — 갱신 시 주석의 판도 같이 바꾼다.
permissions:
  contents: read

jobs:
  backend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # GHCR 게시
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/mk2-backend
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: backend-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # Release 초안 생성
    steps:
      - uses: actions/checkout@v4
      # GHCR 이미지 이름은 소문자만 된다(owner 가 choBottle 이어도 ghcr.io/chobottle/...).
      - run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## 배포
            ```bash
            git checkout ${{ github.ref_name }}
            cd deploy && ./scripts/init-env.sh
            # 미리 빌드된 이미지를 쓰려면 deploy/.env 에:
            #   MK2_BACKEND_IMAGE=ghcr.io/${{ env.OWNER_LC }}/mk2-backend:${{ github.ref_name }}
            docker compose up -d --wait && ./scripts/healthcheck.sh
            ```
            업그레이드 절차와 이번 판의 배포 변경(환경변수·DB 마이그레이션)은 `CHANGELOG.md` 와 `docs/deployment/operations.md`.
