# 정적 검사 + 파트별 단위 시험 (인프라 없이 도는 것)
# 백엔드 회귀(인프라 필요)는 deploy-smoke 가 실제 스택 위에서 돌린다.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 파이썬 린트 (ruff — 구문 오류·정의 안 된 이름)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff==0.17.3
      # 규칙 묶음은 루트 ruff.toml (E9·F63·F7·F82 — 실제 버그만)
      - run: ruff check . --output-format github

  server-unit:
    name: 백엔드 단위 시험 (인프라 없이 · py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = pyproject requires-python 하한, 3.12 = 운영 이미지 판
        python: ["3.10", "3.12"]
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: server/pyproject.toml }
      - run: pip install -e ".[dev]"
      # 브로커·Kafka·DB·관측 저장소가 필요한 시험은 conftest 가 `infra` 마커를 붙인다 — 그건 deploy-smoke 가 실제 스택 위에서 돈다.
      - run: python -m pytest -q -p no:cacheprovider -m "not infra"
      - name: 공통 규격 예제 ↔ 스키마 (contracts/common/examples)
        run: python contracts/common/validate_examples.py

  hardware:
    name: 하드웨어 벤치 시험 (장치 없이)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # 판은 hardware/pi/robot/Dockerfile 과 맞춘다
      - run: pip install paho-mqtt==2.1.0 protobuf==7.36.1
      - name: 바이트코드 컴파일 (hardware · camera360 · osmocam)
        run: python -m compileall -q hardware camera360 osmocam
      # 벤치 시험은 pytest 가 아니라 __main__ 스크립트다(각 파일 docstring 의 실행법 그대로).
      # unity_state_test 는 시험이 아니라 실물 유니티로 보내는 송신기라 뺀다.
      - name: pi 벤치 (go1_relay · physical_command · physical_command_node · unity_bridge)
        working-directory: hardware/pi
        env:
          # 노드 기본 스풀은 /var/lib/hw-node (Pi 에서 root 로 도는 경로) — 러너에선 쓸 수 없다
          HW_SPOOL_PATH: ${{ runner.temp }}/hw-node/spool.jsonl
        run: |
          for m in go1_relay_test physical_command_test physical_command_node_test unity_bridge_test; do
            echo "== bench.$m"; python -m "bench.$m"
          done
      - name: 엣지 (가용성 판정 · 미디어 게이트웨이)
        working-directory: hardware/edge
        run: python test_edge.py

  web-dashboard:
    name: web-dashboard 타입 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: visualization/web-dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: visualization/web-dashboard/package-lock.json }
      - run: npm ci
      - run: npm run -s typecheck

  deploy-config:
    name: 배포 설정 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: compose 문법 (중앙 · 엣지)
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet
          cp deploy/edge/.env.example deploy/edge/.env
          docker compose -f deploy/edge/docker-compose.yml config --quiet
      - name: OTel Collector 설정 (이미지와 같은 판으로 validate)
        run: |
          IMG=$(grep -m1 -o 'otel/opentelemetry-collector-contrib:[^"[:space:]]*' deploy/docker-compose.yml)
          docker run --rm -v "$PWD/deploy/server/config/otel-collector.yaml:/c.yaml" -e MK2_OTLP_CORS_EXTRA_ORIGIN=http://x:1 "$IMG" validate --config=/c.yaml
          docker run --rm -v "$PWD/deploy/edge/config/otel-collector.yaml:/c.yaml" -e MK2_ZONE_ID=z -e MK2_CENTRAL_OTLP=x:4317 "$IMG" validate --config=/c.yaml
      - name: Prometheus 설정 · 알림 규칙
        run: |
          IMG=$(grep -m1 -o 'prom/prometheus:[^"[:space:]]*' deploy/docker-compose.yml)
          docker run --rm --entrypoint promtool -v "$PWD/deploy/server/config:/c" "$IMG" check config /c/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/server/config:/c" "$IMG" check rules /c/prometheus-rules.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/edge/config:/c" "$IMG" check config /c/prometheus.yml
      - name: 셸 스크립트 (shellcheck)
        run: shellcheck -S warning deploy/scripts/*.sh deploy/server/initdb/*/*.sh
      - name: 이미지 태그 고정 확인 (:latest·태그 없음 금지)
        run: |
          bad=$(grep -hE '^\s*image:' deploy/docker-compose.yml deploy/edge/docker-compose.yml                 | grep -v MK2_BACKEND_IMAGE | grep -vE ':v?[0-9][^[:space:]]*\s*$' || true)
          if [ -n "$bad" ]; then echo "버전이 고정되지 않은 이미지:"; echo "$bad"; exit 1; fi

  contracts:
    name: 공통 규격 예제 (가시화 계약)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema
      - run: python validate_examples.py
        working-directory: visualization/contracts

  ai:
    name: AI perception-framework
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: ai/perception-framework } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ai/perception-framework/pyproject.toml }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0
      - run: pip install -e ".[dev,mqtt,kafka,otel,sim]"
      - run: python -m pytest -q
        env:
          OTEL_SDK_DISABLED: "true"
      # 이미지가 빌드되는지까지 본다 — 저장소에서 빠진 경로를 COPY 해 빌드가 깨진 적이 있다
      - run: docker build -q -t mk2-ai-ci .

  secrets:
    name: 비밀값 스캔 (이번 변경분)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks — PR 이면 base..head, push 면 before..after 만 본다
        # 기존 파일 전체를 훑으면 오탐(브라우저 저장 키 'viz.*' 등)에 묻힌다. 새로 들어오는 것만 막는다.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ -n "${{ github.event.before }}" ] && ! echo "${{ github.event.before }}" | grep -qE '^0+$'; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="-1"
          fi
          echo "범위: $RANGE"
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0             git /repo --redact --no-banner --log-opts="$RANGE"
