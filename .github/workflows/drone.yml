# 드론 파트 자동 검사 — drone/ 이 바뀌는 PR·main 푸시에서 돈다.
#   (모노레포 통합 때 drone/.github/ 에서 옮겼다 — 하위 폴더의 워크플로는 GitHub 가 실행하지 않는다.
#    원본 Junho_drone 브랜치의 판은 그 브랜치에 그대로 있다.)
#   1) 드론 파이썬 시험 (viz-debugger/drone, PX4 없이 시뮬레이터로)
#   2) 화면 타입 검사 + 드론 쪽 규칙 검사(verify:sar 등)
name: drone
on:
  pull_request:
    paths: ["drone/**", ".github/workflows/drone.yml"]
  push:
    branches: [main]
    paths: ["drone/**", ".github/workflows/drone.yml"]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: drone/viz-debugger/drone } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: drone/viz-debugger/drone/pyproject.toml }
      - run: pip install -e ".[test,image,base]"
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: drone/viz-debugger } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: drone/viz-debugger/package-lock.json }
      - run: npm ci
      - run: npx tsc -p . --noEmit
      - run: |
          for s in verify:sar verify:view-nodes verify:i18n-no-frozen verify:no-raw-korean verify:dep-rules verify:command-through-tracker; do
            echo "== $s"; npm run -s "$s"
          done
